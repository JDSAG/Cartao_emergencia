<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MedAlert | Cadastro</title>

        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>

        <!--Configuração Tailwind-->
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            medalert: {
                                bg: "#050a12",
                                card: "#0a1421",
                                border: "#263548",
                                red: "#ff1f3d",
                                redDark: "#d9142f",
                                text: "#f8fafc",
                                muted: "#94a3b8"
                            }
                        }
                    }
                }
            }
        </script>
    </head>
    <body class="min-h-screen bg-medalert-bg text-medalert-text">
        <main class="min-h-screen flex">
            <!--Lado esquerdo — IDENTIDADE-->
            <section class="hidden lg:flex lg:w-1/2 min-h-screen items-center justify-center relative overflow-hidden border-r border-white/5">
                <!--Glow-->
                <div class="absolute w-[500px] h-[500px] bg-medalert-red/5 rounded-full blur-3xl"></div>

                <div class="relative z-10 flex flex-col items-center text-center px-10">
                    <div class="w-44 h-44 mb-6">
                        <svg viewBox="0 0 200 200" class="w-full h-full">
                            <!--Moldura-->
                            <path d="M45 70V55C45 43 53 35 65 35H80" fill="none" stroke="#ff1f3d" stroke-width="10" stroke-linecap="round"/>

                            <path d="M120 35H135C147 35 155 43 155 55V70" fill="none" stroke="#ff1f3d" stroke-width="10" stroke-linecap="round"/>

                            <path d="M45 130V145C45 157 53 165 65 165H80" fill="none" stroke="#ff1f3d" stroke-width="10" stroke-linecap="round"/>

                            <path d="M120 165H135C147 165 155 157 155 145V130" fill="none" stroke="#ff1f3d" stroke-width="10" stroke-linecap="round"/>

                            <rect x="78" y="55" width="44" height="90" rx="10" fill="#ff1f3d"/>

                            <rect x="55" y="78" width="90" height="44" rx="10" fill="#ff1f3d"/>

                            <path d="M58 100H77L85 87L94 116L105 70L115 111L123 95H142" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>

                    <h1 class="text-5xl font-extrabold tracking-tight">
                        Med<span class="text-medalert-red">Alert</span>
                    </h1>

                    <p class=" mt-4 text-medalert-muted leading-relaxed">
                        Seu cartão de emergência digital,<br>sempre com você.
                    </p>

                    <p class="mt-20 text-slate-600 text-sm italic">
                        Informação que salva vidas.
                    </p>
                </div>
            </section>

            <!--Lado direito — CADASTRO-->
            <section class="w-full lg:w-1/2 min-h-screen flex items-center justify-center px-5 py-10 sm:px-8">
                <div class="w-full max-w-md">
                    <!--Logo mobile-->
                    <div class=" lg:hidden flex flex-col items-center mb-8">
                        <div class="w-16 h-16 rounded-2xl bg-medalert-red flex items-center justify-center shadow-lg shadow-medalert-red/20">
                            <i data-lucide="heart-pulse" class="w-9 h-9 text-white"></i>
                        </div>

                        <h1 class="mt-3 text-2xl font-extrabold">
                            Med<span class="text-medalert-red">Alert</span>
                        </h1>
                    </div>

                    <!--Cabeçalho-->
                    <div class="mb-7">
                        <h2 class="text-3xl sm:text-4xl font-bold tracking-tight">
                            Crie sua conta
                        </h2>

                        <p class="mt-3 text-sm text-medalert-muted leading-relaxed">
                            Cadastre-se para criar e gerenciar seu cartão de emergência.
                        </p>
                    </div>

                    <!--Formulário-->
                    <form id="registerForm" class="space-y-4">
                        <div>
                            <label for="name" class="block mb-2 text-sm font-medium">
                                Nome completo
                            </label>

                            <div class="relative">
                                <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>

                                <input type="text" id="name" name="name" placeholder="Digite seu nome completo" autocomplete="name" required class="w-full h-13 py-3 pl-12 pr-4 rounded-xl bg-medalert-card border border-medalert-border text-white placeholder:text-slate-600 outline-none transition focus:border-medalert-red focus:ring-2 focus:ring-medalert-red/10">
                            </div>
                        </div>

                        <div>
                            <label for="email" class="block mb-2 text-sm font-medium">
                                E-mail
                            </label>

                            <div class="relative">
                                <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>

                                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required class="w-full h-13 py-3 pl-12 pr-4 rounded-xl bg-medalert-card border border-medalert-border text-white placeholder:text-slate-600 outline-none transition focus:border-medalert-red focus:ring-2 focus:ring-medalert-red/10">
                            </div>
                        </div>

                        <div>
                            <label for="cpf" class="block mb-2 text-sm font-medium">
                                CPF
                            </label>

                            <div class="relative">
                                <i data-lucide="file-text" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>


                                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required class="w-full h-13 py-3 pl-12 pr-4 rounded-xl bg-medalert-card border border-medalert-border text-white placeholder:text-slate-600 outline-none transition focus:border-medalert-red focus:ring-2 focus:ring-medalert-red/10">
                            </div>
                        </div>

                        <div>
                            <label for="phone" class="block mb-2 text-sm font-medium">
                                Telefone
                            </label>

                            <div class="relative">
                                <i data-lucide="phone" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>

                                <input type="tel" id="phone" name="phone" placeholder="(00) 00000-0000" maxlength="15" inputmode="tel" autocomplete="tel" required class="w-full h-13 py-3 pl-12 pr-4 rounded-xl bg-medalert-card border border-medalert-border text-white placeholder:text-slate-600 outline-none transition focus:border-medalert-red focus:ring-2 focus:ring-medalert-red/10">
                            </div>
                        </div>

                        <div>
                            <label for="password" class=" block mb-2 text-sm font-medium">
                                Senha
                            </label>

                            <div class="relative">
                                <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>

                                <input type="password" id="password" name="password" placeholder="Crie uma senha" autocomplete="new-password" required class="w-full h-13 py-3 pl-12 pr-12 rounded-xl bg-medalert-card border border-medalert-border text-white placeholder:text-slate-600 outline-none transition focus:border-medalert-red focus:ring-2 focus:ring-medalert-red/10">

                                <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition" aria-label="Mostrar senha">
                                    <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label for="confirmPassword" class=" block mb-2 text-sm font-medium">
                                Confirmar senha
                            </label>

                            <div class="relative">
                                <i data-lucide="shield-check" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>

                                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Digite sua senha novamente" autocomplete="new-password" required class="w-full h-13 py-3 pl-12 pr-12 rounded-xl bg-medalert-card border border-medalert-border text-white placeholder:text-slate-600 outline-none transition focus:border-medalert-red focus:ring-2 focus:ring-medalert-red/10">
                                <button type="button" id="toggleConfirmPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition" aria-label="Mostrar senha">
                                    <i data-lucide="eye" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>

                        <!--Termo-->
                        <div class="pt-2">
                            <label class="flex items-start gap-3 cursor-pointer">
                                <input type="checkbox" id="terms" required class="mt-1 w-4 h-4 rounded accent-medalert-red">

                                <span class="text-xs text-medalert-muted leading-relaxed">
                                    Li e concordo com os

                                    <a href="#" class="text-medalert-red hover:underline">
                                        Termos de Uso
                                    </a>

                                    e a

                                    <a href="#" class="text-medalert-red hover:underline">
                                        Política de Privacidade
                                    </a>.
                                </span>
                            </label>
                        </div>

                        <!--Mensagem-->
                        <div id="registerMessage" class="hidden rounded-xl px-4 py-3 text-sm"></div>

                        <button type="submit" class="w-full h-13 mt-2 rounded-xl bg-medalert-red hover:bg-medalert-redDark text-white font-semibold transition duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-medalert-red/20 active:translate-y-0">
                            Criar minha conta
                        </button>
                    </form>

                    <!--Login -->
                    <p class="mt-7 text-center text-sm text-medalert-muted">
                        Já possui uma conta?

                        <a href="./login.html" class="ml-1 text-medalert-red font-semibold hover:underline">
                            Entrar
                        </a>
                    </p>
                </div>
            </section>
        </main>

        <!--JavaScript-->
        <script src="../js/register.js"></script>

        <!--Lucide-->
        <script>
            lucide.createIcons();
        </script>
    </body>
</html>
