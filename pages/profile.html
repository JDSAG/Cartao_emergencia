<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu Perfil | Cartão de Emergência</title>

        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            medalert: {
                                bg: "#050a12",
                                card: "#0a1421",
                                border: "#263548",
                                red: "#ff1f3d",
                                redDark: "#d9142f",
                                text: "#f8fafc",
                                muted: "#94a3b8"
                            }
                        }
                    }
                }
            }
        </script>
    </head>
    <body class="min-h-screen bg-medalert-bg text-medalert-text">
        <!--Estrutura principal-->
        <div class="min-h-screen flex">
            <!--Sidebar desktop-->
            <aside class="hidden lg:flex w-64 min-h-screen flex-col border-r border-white/5 bg-medalert-bg fixed left-0 top-0 bottom-0">
                <div class="h-20 px-6 flex items-center gap-3 border-b border-white/5">
                    <div class="w-10 h-10 rounded-xl bg-medalert-red flex items-center justify-center shadow-lg shadow-medalert-red/20">
                        <i data-lucide="heart-pulse" class="w-6 h-6 text-white"></i>
                    </div>

                    <span class="text-xl font-extrabold">
                        Med<span class="text-medalert-red">Alert</span>
                    </span>
                </div>

                <!--Menu-->
                <nav class="flex-1 px-4 py-6 space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-medalert-muted hover:bg-white/[0.03] hover:text-white transition text-sm">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>

                        Início
                    </a>

                    <a href="./card.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-medalert-muted hover:bg-white/[0.03] hover:text-white transition text-sm">
                        <i data-lucide="id-card" class="w-5 h-5"></i>

                        Meu cartão
                    </a>

                    <a href="./information.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-medalert-muted hover:bg-white/[0.03] hover:text-white transition text-sm">
                        <i data-lucide="heart-pulse" class="w-5 h-5"></i>

                        Informações médicas
                    </a>

                    <a href="./contacts.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-medalert-muted hover:bg-white/[0.03] hover:text-white transition text-sm">
                        <i data-lucide="users" class="w-5 h-5"></i>

                        Contatos
                    </a>

                    <div class="h-px bg-medalert-border my-5"></div>

                    <a href="./profile.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-medalert-red/10 text-medalert-red font-medium text-sm">
                        <i data-lucide="user" class="w-5 h-5"></i>

                        Meu perfil
                    </a>

                    <a href="./config.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-medalert-muted hover:bg-white/[0.03] hover:text-white transition text-sm">
                        <i data-lucide="settings" class="w-5 h-5"></i>

                        Configurações
                    </a>
                </nav>

                <!--Usuário-->
                <div class="p-4 border-t border-white/5">
                    <div class="flex items-center gap-3 p-3 rounded-xl bg-medalert-card">
                        <div class="w-9 h-9 rounded-full bg-medalert-red/15 text-medalert-red flex items-center justify-center font-bold text-sm" id="sidebarAvatar">
                            U
                        </div>

                        <div class="min-w-0">
                            <p id="sidebarName" class="text-sm font-medium truncate">
                                Usuário
                            </p>

                            <p id="sidebarEmail" class="text-xs text-medalert-muted truncate">
                                usuário@email.com
                            </p>
                        </div>
                    </div>
                </div>
            </aside>

            <!--Mian-->
            <main class="w-full lg:ml-64 pb-24 lg:pb-10 pt-5">
                <!--Página header-->
                <header class="h-15 px-5 sm:px-8 lg:px-10 flex items-center justify-between border-b border-white/5">
                    <div>
                        <h1 class="text-3xl font-bold mt-2">
                            Meu perfil
                        </h1>

                        <p class="text-gray-400 mt-2">
                            Visualize e atualize seus dados pessoais.
                        </p>
                    </div>

                    <a href="./config.html" class="lg:hidden flex items-center justify-center w-10 h-10 rounded-xl bg-medalert-card/80 border border-medalert-red/30 text-gray-300 hover:text-white hover:bg-medalert-red/20 transition">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </a>
                </header>

                <!--Perfil card-->
                <section class="max-w-3xl mx-auto">
                    <div class="bg-emergency-card rounded-3xl overflow-hidden">
                        <div class="mt-8 mx-auto max-w-3xl border border-medalert-red/20 bg-gradient-to-br from-medalert-red/[0.12] to-medalert-card rounded-2xl p-6 md:p-8">
                            <!--Perfil header-->
                            <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5 pb-8 border-b border-emergency-border">
                                <div id="profileAvatar" class="w-24 h-24 rounded-full bg-red-600/20 border border-red-600/30 text-red-400 flex items-center justify-center text-3xl font-bold">
                                    US
                                </div>

                                <div class="text-center sm:text-left">
                                    <h2 id="profileName" class="text-2xl font-bold">
                                        Usuário
                                    </h2>

                                    <p id="profileEmail" class="text-gray-400 mt-1">
                                        email@exemplo.com
                                    </p>

                                    <div class="inline-flex items-center gap-2 mt-3 text-sm text-green-400">
                                        <span class="w-2 h-2 rounded-full bg-green-500"></span>

                                        Conta cadastrada
                                    </div>
                                </div>
                            </div>

                            <!--Formulário-->
                            <form id="profileForm" class="mt-8 space-y-6">
                                <div>
                                    <h3 class="text-lg font-semibold">
                                        Dados pessoais
                                    </h3>

                                    <p class="text-sm text-gray-500 mt-1">
                                        Mantenha seus dados atualizados.
                                    </p>
                                </div>

                                <div>
                                    <label for="name" class="block text-sm font-medium text-gray-300 mb-2">
                                        Nome completo
                                    </label>

                                    <div class="relative">
                                        <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>

                                        <input type="text" id="name" name="name" required autocomplete="name" class="w-full bg-gray-900 border border-emergency-border rounded-xl py-3 pl-11 pr-4 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-red-600" placeholder="Digite seu nome completo">
                                    </div>

                                    <p id="nameError" class="text-sm text-red-400 mt-1 hidden"></p>
                                </div>

                                <div>
                                    <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
                                        E-mail
                                    </label>

                                    <div class="relative">
                                        <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>

                                        <input type="email" id="email" name="email" required autocomplete="email" class="w-full bg-gray-900 border border-emergency-border rounded-xl py-3 pl-11 pr-4 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-red-600" placeholder="Digite seu e-mail">
                                    </div>

                                    <p id="emailError" class="text-sm text-red-400 mt-1 hidden"></p>
                                </div>

                                <div>
                                    <label for="cpf" class="block text-sm font-medium text-gray-300 mb-2">
                                        CPF
                                    </label>

                                    <div class="relative">
                                        <i data-lucide="fingerprint" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>

                                        <input type="text" id="cpf" name="cpf" maxlength="14" autocomplete="off" class="w-full bg-gray-900 border border-emergency-border rounded-xl py-3 pl-11 pr-4 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-red-600" placeholder="000.000.000-00">
                                    </div>
                                </div>

                                <div>
                                    <label for="phone" class="block text-sm font-medium text-gray-300 mb-2">
                                        Telefone
                                    </label>

                                    <div class="relative">
                                        <i data-lucide="phone" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>

                                        <input type="tel" id="phone" name="phone" maxlength="15" autocomplete="tel" class="w-full bg-gray-900 border border-emergency-border rounded-xl py-3 pl-11 pr-4 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-red-600" placeholder="(00) 00000-0000">
                                    </div>
                                </div>

                                <!--Mensagem-->
                                <div id="formMessage" class="hidden rounded-xl px-4 py-3 text-sm"></div>

                                <div class="flex flex-col sm:flex-row gap-3 pt-4">
                                    <button type="submit" class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-red-600 hover:bg-red-700 font-semibold transition">
                                        <i data-lucide="save" class="w-5 h-5"></i>

                                        Salvar alterações
                                    </button>

                                    <button type="reset" class="px-6 py-3 rounded-xl border border-emergency-border text-gray-300 hover:bg-gray-800 transition">
                                        Restaurar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <!--Navegação mobile -->
        <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-50 h-20 bg-medalert-bg/95 backdrop-blur-xl border-t border-white/5 px-3">
            <div class="h-full flex items-center justify-around">
                <a href="./dashboard.html" class="flex flex-col items-center gap-1 text-slate-500"">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>

                    <span class="text-[10px]">
                        Início
                    </span>
                </a>

                <a href="./card.html" class="flex flex-col items-center gap-1 text-slate-500">
                    <i data-lucide="id-card" class="w-5 h-5"></i>

                    <span class="text-[10px]">
                        Cartão
                    </span>
                </a>

                <a href="./contacts.html" class="flex flex-col items-center gap-1 text-slate-500">
                    <i data-lucide="users" class="w-5 h-5"></i>

                    <span class="text-[10px]">
                        Contatos
                    </span>
                </a>

                <a href="./profile.html" class="flex flex-col items-center gap-1 text-medalert-red">
                    <i data-lucide="user" class="w-5 h-5"></i>

                    <span class="text-[10px]">
                        Perfil
                    </span>
                </a>
            </div>
        </nav>

        <script src="../js/profile.js"></script>

        <script>
            lucide.createIcons();
        </script>
    </body>
</html>
